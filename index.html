<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#1a0b2e">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="description" content="Yağmur'S GALAXY - 12 Yıldız, 12 Görev, Sonsuz Aşk">
    <title>Yağmur'S GALAXY 🤍</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- 🌌 Canvas Arkaplan -->
    <canvas id="star-canvas"></canvas>

    <!-- 🎵 Love Story Müzik -->
    <audio id="love-story" loop>
        <source src="sounds/love-story.mp3" type="audio/mpeg">
    </audio>

    <!-- 🎮 Giriş Ekranı -->
    <section class="hero" id="hero">
        <h1>Yağmur</h1>
        <p class="subtitle">Galaksinin Tek Kraliçesi 🤍</p>
        <p class="love-whisper" id="love-whisper">Sen gülünce, evren biraz daha aydınlanıyor…</p>
        <button class="discover-btn" onclick="startGalaxy()">KEŞFET</button>
    </section>

    <!-- ⭐ Yıldız Haritası -->
    <section class="galaxy-map" id="galaxy-map" style="display: none;">
        <h2 class="section-title">12 YILDIZ, 12 GÖREV, SONSUZ AŞK</h2>
        
        <!-- Yıldız Container -->
        <div class="stars-container" id="stars-container"></div>
    </section>

    <!-- 🖼️ Yıldız Modalı -->
    <div class="star-modal" id="star-modal" style="display: none;">
        <div class="modal-overlay" onclick="closeModal()"></div>
        <div class="modal-content" id="modal-content">
            <button class="close-btn" onclick="closeModal()">×</button>
            <h2 id="modal-title"></h2>
            <div id="modal-body"></div>
        </div>
    </div>

    <!-- 💥 Big Bang Final -->
    <div class="big-bang-container" id="big-bang" style="display: none;">
        <div class="flash-overlay"></div>
        <canvas id="confetti-canvas"></canvas>
        <div class="final-content">
            <h1>🤍 SENİ ÇOOOOK SEVİYORUM YağmurMMM!!! 🤍</h1>
            <p class="typewriter-text" id="final-text"></p>
        </div>
    </div>

    <!-- 🤍 Kalp Yağmuru Container -->
    <div id="hearts-container"></div>

    <!-- 🎵 Müzik Kontrol Butonu -->
    <button class="music-control" id="music-btn" onclick="toggleMusic()">♪</button>

    <!-- 12. Yıldız Final Modal -->
    <div id="final-star-modal" class="final-modal">
        <div class="final-modal-backdrop"></div>
        <div class="final-scroll-container">
            <div class="final-content-box">
                <button class="final-close-btn" onclick="closeFinalStar()">✕</button>
                
                <h1 class="final-title">💛 SENİ ÇOOOOK SEVİYORUM YağmurMMM!!! 💛</h1>
                
                <div class="final-text-wrapper" id="finalTextContent">
                    <!-- finalMessage buraya JS ile doldurulacak -->
                </div>
                
                <!-- Boşluk için -->
                <div class="final-spacer"></div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="js/stars-data.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
